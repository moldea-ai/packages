          "${{ runner.temp }}/public-package-tarballs"

  cli-runtime-compatibility:
    name: CLI Runtime (${{ matrix.os }}, Node.js ${{ matrix.node-version }})
    needs: [plan, checks]
    if: ${{ needs.plan.outputs.cli_runtime_compatibility == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - 22.11.0
          - 22.x
          - 24.11.0
          - 24.x
          - 26.8.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download CLI Runtime Artifacts
        uses: actions/download-artifact@v8
        with:
          name: public-package-tarballs
          path: ${{ runner.temp }}/public-package-tarballs

      - name: Test Packed CLI Runtime
        run: >-
          node projects/cli/scripts/runtime-compatibility/index.mjs
          "${{ runner.temp }}/public-package-tarballs"

  adapter-openai-runtime-compatibility:
