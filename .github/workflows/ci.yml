name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      test_suite:
        description: Correctness priority, independent of affected workspaces. Releases force full.
        required: false
        type: string
        default: essential
      release_project:
        description: Public project key used to isolate concurrent release verification.
        required: false
        type: string
        default: ''
      release_build:
        description: Disable dependency caching and retain release-ready package artifacts.
        required: false
        type: boolean
        default: false
      comparison_commit:
        description: Exact comparison commit for ordinary main-push verification.
        required: false
        type: string
        default: ''
      live_registry:
        description: Resolve packed-consumer dependencies from the live registry instead of the reviewed snapshot.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      test_suite:
        description: Full checks every workspace without publishing.
        type: choice
        default: essential
        options: [essential, full]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_project }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 11.9.0
  # packed consumers resolve from the reviewed registry snapshot unless the canary asks for live
  MOLDEA_LIVE_REGISTRY: ${{ inputs.live_registry == true && 'true' || 'false' }}
  # retry transient registry resets, including pnpm's own installation through npm
  npm_config_fetch_retries: '5'
  pnpm_config_fetch_retries: '5'

jobs:
  plan:
    name: Select CI Workspaces
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.selection.outputs.plan }}
      artifacts: ${{ steps.selection.outputs.artifacts }}
      cross_platform: ${{ steps.selection.outputs.cross_platform }}
      website: ${{ steps.selection.outputs.website }}
      test_suite: ${{ steps.selection.outputs.test_suite }}
      cli_runtime_matrix: ${{ steps.selection.outputs.cli_runtime_matrix }}
      repository_fs_runtime_matrix: ${{ steps.selection.outputs.repository_fs_runtime_matrix }}
      consumer_conformance: ${{ steps.selection.outputs.consumer_conformance }}
      cli_testing_peer_compatibility: ${{ steps.selection.outputs.cli_testing_peer_compatibility }}
      repository_fs_runtime_compatibility: ${{ steps.selection.outputs.repository_fs_runtime_compatibility }}
      cli_runtime_compatibility: ${{ steps.selection.outputs.cli_runtime_compatibility }}
      registry_snapshot: ${{ steps.registry.outputs.registry_snapshot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Select Verification Workspaces
        id: selection
        env:
          CI_BASE_COMMIT: ${{ inputs.comparison_commit || github.event.pull_request.base.sha || github.event.before || '' }}
          CI_TESTED_COMMIT: ${{ github.sha }}
          CI_RELEASE_BUILD: ${{ inputs.release_build == true && 'true' || 'false' }}
          CI_TEST_SUITE: ${{ inputs.test_suite || 'essential' }}
        run: node scripts/ci/plan.ts

      # the Skill consumer lanes receive the same snapshot; the canary passes none, so they resolve live
      - name: Resolve Registry Snapshot
        id: registry
        if: ${{ env.MOLDEA_LIVE_REGISTRY != 'true' }}
        run: >-
          node --input-type=module --eval
          "import { REGISTRY_SNAPSHOT } from './configs/registry-snapshot/index.mjs';
          console.log('registry_snapshot=' + REGISTRY_SNAPSHOT);"
          >> "$GITHUB_OUTPUT"

  checks:
    name: Check Selected Workspaces
    needs: plan
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host --init
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MOLDEA_CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trust Container Workspace for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with dependency caching
        if: ${{ inputs.release_build != true }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Node.js for a release build
        if: ${{ inputs.release_build == true }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Changed Package Versions
        if: ${{ github.event_name == 'pull_request' }}
        env:
          RELEASE_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          RELEASE_CURRENT_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: >-
          pnpm release:check-changes
          "$RELEASE_BASE_COMMIT"
          "$RELEASE_CURRENT_COMMIT"

      - name: Verify Selected Workspaces and Shared Contracts
        run: pnpm ci:run checks

  pack:
    name: Pack Public Package Artifacts
    needs: plan
    if: ${{ needs.plan.outputs.artifacts == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # packs in the checks image, so lanes can start without changing the tarballs' build environment
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host --init
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trust Container Workspace for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with dependency caching
        if: ${{ inputs.release_build != true }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Node.js for a release build
        if: ${{ inputs.release_build == true }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Public Packages
        run: pnpm exec turbo run build --filter=@moldea.ai/cli... --filter=@moldea.ai/website-ui

      - name: Pack Public Package Artifacts
        run: |
          public_packages_directory="$GITHUB_WORKSPACE/artifacts/public-package-tarballs"
          mkdir -p "$public_packages_directory"
          pnpm --dir projects/repository pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/repository-fs pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/core pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/cli pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/website-ui pack --pack-destination "$public_packages_directory"
          pnpm release:checksums create "$public_packages_directory"
          pnpm release:checksums verify-consumers "$public_packages_directory"
          git rev-parse HEAD > "$public_packages_directory/packages-commit.txt"

          expected_tarball_count=5
          actual_tarball_count=$(find "$public_packages_directory" -maxdepth 1 -type f -name '*.tgz' | wc -l)
          if [ "$actual_tarball_count" -ne "$expected_tarball_count" ]; then
            echo "Expected $expected_tarball_count package tarballs, found $actual_tarball_count." >&2
            exit 1
          fi

      - name: Upload Public Package Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: public-package-tarballs
          path: |
            artifacts/public-package-tarballs/*.tgz
            artifacts/public-package-tarballs/SHA256SUMS
            artifacts/public-package-tarballs/packages-commit.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  consumer-conformance:
    name: Exact Artifact Skill Consumers
    needs: [plan, pack]
    if: ${{ needs.plan.outputs.consumer_conformance == 'true' }}
    permissions:
      contents: read
    uses: moldea-ai/skill/.github/workflows/release-candidate.yml@950b89eb4c41564953fa1582fdd588992e152d37
    with:
      artifact_name: public-package-tarballs
      packages_ref: ${{ github.sha }}
      skill_ref: 950b89eb4c41564953fa1582fdd588992e152d37
      skill_version: '10.0.0'
      registry_snapshot: ${{ needs.plan.outputs.registry_snapshot }}

  cli-testing-peer-compatibility:
    name: CLI Existing Vitest 3.2.4 Compatibility
    needs: [plan, pack]
    if: ${{ needs.plan.outputs.cli_testing_peer_compatibility == 'true' }}
    runs-on: ubuntu-latest
    env:
      PNPM_VERSION: 11.21.0
      VITEST_VERSION: 3.2.4
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Public Package Artifacts
        uses: actions/download-artifact@v8
        with:
          name: 'public-package-tarballs'
          path: ${{ runner.temp }}/public-package-tarballs

      - name: Pin Registry Snapshot
        if: ${{ env.MOLDEA_LIVE_REGISTRY != 'true' }}
        run: node configs/registry-snapshot/write-environment.mjs >> "$GITHUB_ENV"

      - name: Test Packed CLI with Existing Vitest
        run: >-
          node projects/cli/scripts/testing-peer-compatibility/index.mjs
          "${{ runner.temp }}/public-package-tarballs"
          "${{ env.VITEST_VERSION }}"

  repository-fs-runtime-compatibility:
    name: Repository FS Runtime (Node.js ${{ matrix.node-version }})
    needs: [plan, pack]
    if: ${{ needs.plan.outputs.repository_fs_runtime_compatibility == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.repository_fs_runtime_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download Repository FS Runtime Artifacts
        uses: actions/download-artifact@v8
        with:
          name: public-package-tarballs
          path: ${{ runner.temp }}/public-package-tarballs

      - name: Pin Registry Snapshot
        if: ${{ env.MOLDEA_LIVE_REGISTRY != 'true' }}
        run: node configs/registry-snapshot/write-environment.mjs >> "$GITHUB_ENV"

      - name: Test Packed Repository FS Runtime
        run: >-
          node projects/repository-fs/scripts/runtime-compatibility/index.mjs
          "${{ runner.temp }}/public-package-tarballs"

  cli-runtime-compatibility:
    name: CLI Runtime (${{ matrix.os }}, Node.js ${{ matrix.node-version }})
    needs: [plan, pack]
    if: ${{ needs.plan.outputs.cli_runtime_compatibility == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cli_runtime_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download CLI Runtime Artifacts
        uses: actions/download-artifact@v8
        with:
          name: public-package-tarballs
          path: ${{ runner.temp }}/public-package-tarballs

      - name: Pin Registry Snapshot
        if: ${{ env.MOLDEA_LIVE_REGISTRY != 'true' }}
        run: node configs/registry-snapshot/write-environment.mjs >> "$GITHUB_ENV"

      - name: Test Packed CLI Runtime
        run: >-
          node projects/cli/scripts/runtime-compatibility/index.mjs
          "${{ runner.temp }}/public-package-tarballs"

  test-cross-platform:
    name: Test (${{ matrix.os }})
    needs: plan
    if: ${{ needs.plan.outputs.cross_platform == 'true' }}
    env:
      MOLDEA_CI_PLAN: ${{ needs.plan.outputs.plan }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with dependency caching
        if: ${{ inputs.release_build != true }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Node.js for a release build
        if: ${{ inputs.release_build == true }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Website Browser
        if: ${{ needs.plan.outputs.website == 'true' && needs.plan.outputs.test_suite == 'full' }}
        run: pnpm --filter @moldea.ai/packages-website exec playwright install chromium

      - name: Test Selected Workspaces
        run: pnpm ci:run test

  verify:
    name: Verify Repository
    if: ${{ always() }}
    needs:
      - plan
      - checks
      - pack
      - consumer-conformance
      - cli-testing-peer-compatibility
      - repository-fs-runtime-compatibility
      - cli-runtime-compatibility
      - test-cross-platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require Successful Selected Jobs
        env:
          MOLDEA_CI_PLAN: ${{ needs.plan.outputs.plan }}
          GITHUB_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/run.ts gate
