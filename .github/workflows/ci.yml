name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      release_project:
        description: Public project key used to isolate concurrent release verification.
        required: false
        type: string
        default: ''
      release_build:
        description: Disable dependency caching and retain release-ready package artifacts.
        required: false
        type: boolean
        default: false
      comparison_commit:
        description: Exact comparison commit for ordinary main-push verification.
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_project }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 11.9.0

jobs:
  plan:
    name: Select CI Workspaces
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.selection.outputs.plan }}
      artifacts: ${{ steps.selection.outputs.artifacts }}
      cross_platform: ${{ steps.selection.outputs.cross_platform }}
      website: ${{ steps.selection.outputs.website }}
      consumer_conformance: ${{ steps.selection.outputs.consumer_conformance }}
      repository_testing_peer_compatibility: ${{ steps.selection.outputs.repository_testing_peer_compatibility }}
      cli_testing_peer_compatibility: ${{ steps.selection.outputs.cli_testing_peer_compatibility }}
      repository_fs_runtime_compatibility: ${{ steps.selection.outputs.repository_fs_runtime_compatibility }}
      cli_runtime_compatibility: ${{ steps.selection.outputs.cli_runtime_compatibility }}
      adapter_anthropic_runtime_compatibility: ${{ steps.selection.outputs.adapter_anthropic_runtime_compatibility }}
      adapter_google_genai_runtime_compatibility: ${{ steps.selection.outputs.adapter_google_genai_runtime_compatibility }}
      adapter_openai_runtime_compatibility: ${{ steps.selection.outputs.adapter_openai_runtime_compatibility }}
      adapter_openai_agents_sdk_runtime_compatibility: ${{ steps.selection.outputs.adapter_openai_agents_sdk_runtime_compatibility }}
      adapter_claude_agent_sdk_runtime_compatibility: ${{ steps.selection.outputs.adapter_claude_agent_sdk_runtime_compatibility }}
      adapter_cloudflare_agents_runtime_compatibility: ${{ steps.selection.outputs.adapter_cloudflare_agents_runtime_compatibility }}
      adapter_eve_runtime_compatibility: ${{ steps.selection.outputs.adapter_eve_runtime_compatibility }}
      adapter_langchain_runtime_compatibility: ${{ steps.selection.outputs.adapter_langchain_runtime_compatibility }}
      adapter_langgraph_runtime_compatibility: ${{ steps.selection.outputs.adapter_langgraph_runtime_compatibility }}
      adapter_vercel_ai_sdk_runtime_compatibility: ${{ steps.selection.outputs.adapter_vercel_ai_sdk_runtime_compatibility }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Select Verification Workspaces
        id: selection
        env:
          CI_BASE_COMMIT: ${{ inputs.comparison_commit || github.event.pull_request.base.sha || github.event.before || '' }}
          CI_TESTED_COMMIT: ${{ github.sha }}
          CI_RELEASE_BUILD: ${{ inputs.release_build == true && 'true' || 'false' }}
        run: node scripts/ci/plan.ts

  checks:
    name: Check Selected Workspaces
    needs: plan
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host --init
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      MOLDEA_CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Trust Container Workspace for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with dependency caching
        if: ${{ inputs.release_build != true }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Node.js for a release build
        if: ${{ inputs.release_build == true }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Changed Package Versions
        if: ${{ github.event_name == 'pull_request' }}
        env:
          RELEASE_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          RELEASE_CURRENT_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: >-
          pnpm release:check-changes
          "$RELEASE_BASE_COMMIT"
          "$RELEASE_CURRENT_COMMIT"

      - name: Verify Selected Workspaces and Shared Contracts
        run: pnpm ci:run checks

      - name: Pack Public Package Artifacts
        if: ${{ needs.plan.outputs.artifacts == 'true' }}
        run: |
          public_packages_directory="$GITHUB_WORKSPACE/artifacts/public-package-tarballs"
          mkdir -p "$public_packages_directory"
          pnpm --dir projects/repository pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/repository-fs pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/core pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/adapter-anthropic pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/adapter-google-genai pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/adapter-openai pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/adapter-openai-agents-sdk pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/adapter-claude-agent-sdk pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/adapter-cloudflare-agents pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/adapter-eve pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/adapter-langchain pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/adapter-langgraph pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/adapter-vercel-ai-sdk pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/cli pack --pack-destination "$public_packages_directory"
          pnpm --dir projects/website-ui pack --pack-destination "$public_packages_directory"
          pnpm release:checksums create "$public_packages_directory"
          pnpm release:checksums verify-consumers "$public_packages_directory"
          git rev-parse HEAD > "$public_packages_directory/packages-commit.txt"
          cp apps/website/dist/compatibility/runtimes.json \
            "$public_packages_directory/runtime-compatibility-publication.json"

          expected_tarball_count=15
          actual_tarball_count=$(find "$public_packages_directory" -maxdepth 1 -type f -name '*.tgz' | wc -l)
          if [ "$actual_tarball_count" -ne "$expected_tarball_count" ]; then
            echo "Expected $expected_tarball_count package tarballs, found $actual_tarball_count." >&2
            exit 1
          fi

      - name: Upload Public Package Artifacts
        if: ${{ needs.plan.outputs.artifacts == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: public-package-tarballs
          path: |
            artifacts/public-package-tarballs/*.tgz
            artifacts/public-package-tarballs/SHA256SUMS
            artifacts/public-package-tarballs/packages-commit.txt
            artifacts/public-package-tarballs/runtime-compatibility-publication.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  consumer-conformance:
    name: Exact Artifact Skill Consumers
    needs: [plan, checks]
    if: ${{ needs.plan.outputs.consumer_conformance == 'true' }}
    permissions:
      contents: read
    uses: moldea-ai/skill/.github/workflows/release-candidate.yml@ee7e74dde63d610da6306967885dbb293ec8f4e5
    with:
      artifact_name: public-package-tarballs
      packages_ref: ${{ github.sha }}
      skill_ref: ee7e74dde63d610da6306967885dbb293ec8f4e5
      skill_version: '7.0.0'

  repository-testing-peer-compatibility:
    name: Repository Testing Peers (Vitest ${{ matrix.vitest-version }})
    needs: [plan, checks]
    if: ${{ needs.plan.outputs.repository_testing_peer_compatibility == 'true' }}
    runs-on: ubuntu-latest
    env:
      PNPM_VERSION: 11.9.0
      WEB_UTILS_KIT_VERSION: 1.3.1
    strategy:
      fail-fast: false
      matrix:
        vitest-version:
          - 1.0.0
          - 2.0.0
          - 3.2.4
          - 4.1.10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Public Package Artifacts
        uses: actions/download-artifact@v8
        with:
          name: 'public-package-tarballs'
          path: ${{ runner.temp }}/public-package-tarballs

      - name: Test Packed Repository Testing Peers
        run: >-
          node projects/repository/scripts/testing-peer-compatibility/index.mjs
          "${{ runner.temp }}/public-package-tarballs"
          "${{ matrix.vitest-version }}"

  cli-testing-peer-compatibility:
    name: CLI Existing Vitest 3.2.4 Compatibility
    needs: [plan, checks]
    if: ${{ needs.plan.outputs.cli_testing_peer_compatibility == 'true' }}
    runs-on: ubuntu-latest
    env:
      PNPM_VERSION: 11.21.0
      VITEST_VERSION: 3.2.4
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Public Package Artifacts
        uses: actions/download-artifact@v8
        with:
          name: 'public-package-tarballs'
          path: ${{ runner.temp }}/public-package-tarballs

      - name: Test Packed CLI with Existing Vitest
        run: >-
          node projects/cli/scripts/testing-peer-compatibility/index.mjs
          "${{ runner.temp }}/public-package-tarballs"
          "${{ env.VITEST_VERSION }}"

  repository-fs-runtime-compatibility:
    name: Repository FS Runtime (Node.js ${{ matrix.node-version }})
    needs: [plan, checks]
    if: ${{ needs.plan.outputs.repository_fs_runtime_compatibility == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.11.0
          - 22.x
          - 24.11.0
          - 24.x
          - 26.8.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download Repository FS Runtime Artifacts
