  test-cross-platform:
    name: Test (${{ matrix.os }})
    needs: plan
    if: ${{ needs.plan.outputs.cross_platform == 'true' }}
    env:
      MOLDEA_CI_PLAN: ${{ needs.plan.outputs.plan }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js with dependency caching
        if: ${{ inputs.release_build != true }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Node.js for a release build
        if: ${{ inputs.release_build == true }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Website Browser
        if: ${{ needs.plan.outputs.website == 'true' }}
        run: pnpm --filter @moldea.ai/packages-website exec playwright install chromium

      - name: Test Selected Workspaces
        run: pnpm ci:run test

  verify:
    name: Verify Repository
    if: ${{ always() }}
    needs:
      - plan
      - checks
      - consumer-conformance
      - repository-testing-peer-compatibility
      - cli-testing-peer-compatibility
      - repository-fs-runtime-compatibility
      - cli-runtime-compatibility
      - adapter-anthropic-runtime-compatibility
      - adapter-google-genai-runtime-compatibility
      - adapter-openai-runtime-compatibility
      - adapter-openai-agents-sdk-runtime-compatibility
      - adapter-claude-agent-sdk-runtime-compatibility
      - adapter-cloudflare-agents-runtime-compatibility
      - adapter-eve-runtime-compatibility
      - adapter-langchain-runtime-compatibility
      - adapter-langgraph-runtime-compatibility
      - adapter-vercel-ai-sdk-runtime-compatibility
      - test-cross-platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require Successful Selected Jobs
        env:
          MOLDEA_CI_PLAN: ${{ needs.plan.outputs.plan }}
          GITHUB_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/run.ts gate
