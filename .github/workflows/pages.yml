name: Deploy Packages Website

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - apps/website/**
      - compatibility/**
      - configs/**
      - docs/**
      - projects/**
      - scripts/runtime-compatibility/**
      - scripts/website/**
      - .prettierignore
      - .prettierrc
      - eslint.config.js
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.15.0
  PNPM_VERSION: 11.9.0

jobs:
  build:
    name: Build Pages Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website UI
        run: pnpm --filter @moldea.ai/website-ui build

      - name: Install website browser
        run: pnpm --filter @moldea.ai/packages-website exec playwright install --with-deps chromium

      - name: Check runtime compatibility
        run: pnpm compatibility:check

      - name: Check documentation sources
        run: pnpm docs:check

      - name: Test website generators
        run: pnpm --filter @moldea.ai/packages-website test:unit

      - name: Typecheck website
        run: pnpm --filter @moldea.ai/packages-website typecheck

      - name: Lint website
        run: pnpm --filter @moldea.ai/packages-website lint

      - name: Build and validate static website
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: https://${{ steps.pages.outputs.host }}
        run: pnpm website:build

      - name: Test static artifact integration
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: https://${{ steps.pages.outputs.host }}
        run: pnpm --filter @moldea.ai/packages-website test:integration

      - name: Test browser behavior
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: https://${{ steps.pages.outputs.host }}
        run: pnpm --filter @moldea.ai/packages-website test:e2e

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/website/dist

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  submit-sitemap:
    name: Submit Sitemap to Google Search Console
    needs: deploy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEARCH_CONSOLE_PROPERTY: sc-domain:moldea.ai
      SITEMAP_URL: https://packages.moldea.ai/sitemap-index.xml
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Authenticate to Google Search Console
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
          service_account: moldea-sitemap-submitter@moldea-prod.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
          create_credentials_file: false

      - name: Submit sitemap
        env:
          ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          property_path="$(
            node -p 'encodeURIComponent(process.env.SEARCH_CONSOLE_PROPERTY)'
          )"
          sitemap_path="$(
            node -p 'encodeURIComponent(process.env.SITEMAP_URL)'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request PUT \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://www.googleapis.com/webmasters/v3/sites/${property_path}/sitemaps/${sitemap_path}"
